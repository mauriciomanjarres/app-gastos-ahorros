name: Compilar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MisFinanzas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MisFinanzas-apk
          path: MisFinanzas.apk
      - name: Publicar APK en Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version MisFinanzas.apk \
            --title "Mis Finanzas (última versión)" \
            --notes "APK listo para instalar. Compilado desde ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
